# The standalone bundle installs the published rc6 client stack at its root.
# Keep that graph internally consistent: downstream rc6 plugins inject the
# plural input-trigger/commands services, so the legacy 0808 rows must not be
# mounted beside them in the packaged WebView.
- id: ui-slash
  name: '@deepseek-ai/dsh-client-ui-slash'
  disabled: true
- id: ui-command
  name: '@deepseek-ai/dsh-client-ui-command'
  disabled: true
- id: ui-input-trigger
  name: '@deepseek-ai/dsh-client-ui-input-trigger'
  disabled: false
- id: ui-commands
  name: '@deepseek-ai/dsh-client-ui-commands'
  disabled: false
