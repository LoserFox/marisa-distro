packages:
  - '.'
  - 'harness'
  - 'harness/packages/*'
  - 'harness/packages/*/*'
  - 'harness/vendor/*'
  - 'harness/apps/*'
  # native landlock-run workspace packages (referenced as workspace:* by
  # bash-sandbox / sandbox-local / agent-spine-demo). Listed EXPLICITLY, not
  # globbed: pnpm 11 fails to match native/landlock-run/packages/* from
  # absolute-path workspace files (ERR_PNPM_WORKSPACE_PKG_NOT_FOUND) while
  # bash-sandbox depends on the entry package via workspace:*. Entry package
  # is a pure-JS wrapper; linux-* platform packages are os:linux and inert on
  # Windows.
  - 'harness/native/landlock-run'
  - 'harness/native/landlock-run/packages/entry'
  - 'harness/native/landlock-run/packages/linux-arm64'
  - 'harness/native/landlock-run/packages/linux-x64'
  # rc7 sync (2026-08-18): examples/ and website/ are upstream workspace
  # members referenced by tsconfig.host.json; keeping harness sources pristine
  # (submodule direction) means their deps install here instead of trimming
  # the upstream tsconfig.
  - 'harness/examples'
  - 'harness/website'
  - 'plugins/*'
  - 'bundles/*'
  # vendored MyGO (omdsh-dev/dsh-mygo@next, keyed-adapted 2026-08-18);
  # its own pnpm-workspace.yaml is NOT staged to avoid the nested-workspace pitfall.
  - 'dsh-mygo/packages/*/*'
  - 'profiles/marisa/runtime'

nodeLinker: hoisted
linkWorkspacePackages: true
install-links: false
# Builds and HMR rewrite workspace lib/ outputs. Never let `pnpm run` turn that
# expected development state into an implicit install; installs are explicit
# and frozen at repository/CI boundaries.
verifyDepsBeforeRun: false
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  lefthook: true
  node-pty: true
  protobufjs: true
  sharp: true

# dsh-code-map (vendored standalone plugin) declares bare `schemastery`
# (^3.18.0). In this workspace that name resolves to harness/vendor/schemastery,
# whose lib/ only exists after the harness build — its prepare-time tsc then
# fails with TS2307. Redirect only that plugin's dependency to the published
# @deepseek-ai/schemastery (same code, ships lib/types), leaving the vendored
# workspace package and all harness links untouched.
overrides:
  '@dsh-external/dsh-code-map>schemastery': 'npm:@deepseek-ai/schemastery@3.18.1'
  # Some third-party plugin declares bare `cordis: >=4.0.0 <5.0.0-0`; pin
  # the bare peer to the rc7-compatible published release.
  cordis: 4.0.0-rc.7
  # rc7 sync (2026-08-18): upstream pins typescript@6.0.3 (harness devDep ^6.0.3);
  # without an override the hoisted top-level resolves 5.9.3 and tsc -b fails
  # on rc7 test sources. All peer ranges (>=4.8 / >=5) accept 6.0.3.
  typescript: 6.0.3
  # fflate: @deepseek-ai/dsh-host-apiproxy imports `{ Zip } from "fflate"`,
  # which only works against an ESM build (0.8.x). @univerjs-pro/exchange-client
  # pins 0.4.9 exactly (CJS-only, no exports map). The bundled --prod install
  # prunes devDeps (including @types/three, the other 0.8.3 edge), leaving
  # 0.4.9 the hoist winner at the workspace root; the pnpm hoisted linker does
  # not nest a conflicting version for workspace members, so apiproxy resolves
  # 0.4.9 and the backend never boots. A single-version override makes the
  # top-level hoist deterministic in every install mode; the bundle prunes
  # @univerjs* anyway, and dev-mode xlsx zip keeps working on 0.8.x.
  fflate: '0.8.3'
# 近期发布的 registry 包会被 minimumReleaseAge 默认拦截；
# 根 workspace 与 profile 生成器各自维护其依赖的 exclude 列表。
