# ── 纯 host 插件 ──
- insert:
    - id: a2a
      name: '@dpskh/a2a'

# ── 自改层：agent 会话内 inspect/define/run/stop/undefine 插件（官方 demo:cordis 同款）──
- insert:
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

# ── skill 管理器（/skills /skill-remove + skill_manage 工具，读写 ~/.dsh/skills）──
- insert:
    - id: skill-manager
      name: dsh-skill-manager

# ── dsh-mnemon（记忆系统，2026-08-19 集成）──
# 三层记忆：runtime memory（USER.md/MEMORY.md 投影注入）+ documents + memory
# spaces（跨会话知识图谱，mnemon-native 引擎）。Go 引擎二进制 v0.2.3 随包
# （desktop/bundle/mnemon.exe，launcher 的 PATH 前缀解析 `mnemon`）。
# 硬化默认（2026-08-19 评估 B4）：workspace 存储 + local-only 数据边界
# （远程 provider 需用户显式配置）+ remoteAccess 只读。
- insert:
    - id: mnemon
      name: dsh-mnemon
      config:
        routingGuidance: true
        displayMode: sidebar
        lifecycleEnabled: true
        recallMode: guided
        writebackMode: guided
        idleReviewMs: 30000
        tabEnabled: true
        writeEnabled: true
        remoteAccess: read-only
        storageScope: workspace
        dataBoundary: local-only
        timeoutMs: 10000
        defaultRecallLimit: 10
        recallQuality:
          policy: strict-v1
          lowScoreThreshold: 0.25
          highScoreThreshold: 0.6
          candidateMultiplier: 3
          maxMediumResults: 4
          maxUnknownResults: 2

# ══ (3) v1 已禁用插件 2/2：ui-workspace（官方工作区浏览器）──
# ya-workspace-sidebar 提供 sidebar.workspaces + conversation.hero.workspace
# 两个席位，禁用官方客户端包（原 allinone 行；官方插件名见
# harness/packages/bundle/web-app/cordis.patch.yml）。
- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: true
