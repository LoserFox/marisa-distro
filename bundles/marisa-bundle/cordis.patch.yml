# 魔理沙 fork 聚合 bundle patch（marisa-bundle，应用于 base / web-app 层之后）
#
# 组成（v1 dsh-allinone 聚合 bundle 的内容，由 fork 的 marisa-bundle 持有）：
#   (1) Windows 原生 PowerShell lane（取自 win-port profile）：禁用 bash 栈
#       （bash-sandbox / tool-bash / permission），换入 pwsh-local + tool-pwsh；
#   (2) 经 rc6 兼容性筛选后保留的 insert 行，行 name 已对照 vendored
#       插件 package.json 逐一核验；
#   (3) v1 已禁用插件对应的 disable 行：ui-workspace（官方工作区浏览器的
#       disable 行）；
#   (4) multimedia-webui-input 判定不兼容 → 禁用行（v1.2 验收报告）。
#
# name 修正记录（对照 plugins/<dir>/package.json 实际 name）：
#   - drag-and-drop：原 allinone 行 '@bill9109/dsh-drag-and-drop'
#     → 实际 '@omdsh-dev/dsh-drag-and-drop'
# 行 name 通过 profile node_modules（file: 链接安装的 vendored 包）解析，
# 必须与包实际 name 一致，否则 Loader 解析不到。

# ══ (1) Windows PowerShell lane（rc7 sync，2026-08-18）══
#
# rc7 base bundle 在 Windows 上原生提供整条 pwsh 栈：
#   - bash-sandbox / tool-bash  自带 `disabled: process.platform === 'win32'`
#   - pwsh-sandbox              自带 `disabled: process.platform !== 'win32'`
#     （SandboxPwshExecutor 注册 ctx.shell，经 ctx.sandbox 的 ACL 受限令牌
#     runner 提供 Windows 沙箱面 —— 不再需要 0808 时代的裸 pwsh-local）
#   - sandbox / sandbox-windows-acl / sandbox-policy 已装配
# 因此 Marisa 只需：
#   - tool-pwsh 补丁行置为 enabled（web-app 层禁用了它）
#   - permission 行改名对齐（0808 的 @deepseek-ai/dsh-permission 在 rc7 是
#     @deepseek-ai/dsh-permission-presets）并保持禁用：pwsh-sandbox 有
#     sandboxMode 能力，但本发行保持 0808 的零键姿态（模型动作不走审批面，
#     工具层策略由 sandbox-policy 的 workspace-write 默认约束）。
#   需要真实隔离 + 审批时，把 permission 改回 enabled 即可。

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true

# rc6 sync (2026-08-18): the base web-app patch now inserts the native rc6
# input stack (ui-input-trigger + ui-commands). The 0808 snapshot's legacy
# ui-slash/ui-command pair no longer exists, so the old "dual-stack locale"
# conflict is gone; the input stack stays mounted from the base bundle.

# tool-pwsh already exists in the rc7 base bundle (and the web-app layer
# disables it); inserting a duplicate entry fails the loader. Patch the
# existing row enabled instead (rc7 sync, 2026-08-18).
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false

# ══ (2) 原 dsh-allinone insert 行（聚合 bundle 退役后直接并入 profile）══

# ── @loserfox/git-identity ──
# git-identity bundle patch: mounts the git-identity row into the profile
# composition. The row name resolves through the profile directory's
# node_modules (the bundle is installed there by `dsh plugin --profile <name> add`).
- insert:
    - id: git-identity
      name: '@loserfox/git-identity'

# ── @deepseek-ai/dsh-genui ──
# dsh-genui bundle for DeepSeek Harness (dsh).
# Inserted into the profile's composition when this bundle is installed
# (`dsh plugin --profile web add link:/path/to/dsh-genui`). The plugin row
# resolves the package by name through the profile's node_modules; the node
# half teaches the model the ```dsh-ui fence, the dshClient half registers
# the browser renderer via the fence-registry extension point.
- insert:
    - id: genui
      name: '@deepseek-ai/dsh-genui'

# ── @dsh-external/workflow ──
# Reusable, governed, durable multi-agent workflows over DSH subagent,
# approval, Session, background-job, command, and tool extension seams.
- insert:
    - id: dsh-external-workflow
      name: '@dsh-external/workflow'

# ── @dsh-external/dsh-vision-toolkit ──
# dsh-vision-toolkit bundle patch: mounts the plugin into a profile layer stack.
# Runtime defaults live at the plugin's config boundary. Users override them in
# their profile patch row with the same id.
- insert:
    - id: vision-toolkit
      name: '@dsh-external/dsh-vision-toolkit'
      config:
        provider:
          baseUrl: 'https://opencode.ai/zen/v1'
          authMode: none
          credential: VISION_API_KEY
          model: mimo-v2.5-free

# ── @bill9109/dsh-web-ui-notify ──
# dsh-web-ui-notify bundle patch: mount the desktop-notification plugin.
# The host half (package root) tracks pending user interactions; the browser
# half (dsh.client) is discovered automatically through the package's
# dsh.client declaration + exports["./client"].
- insert:
    - id: ui-notify
      name: '@bill9109/dsh-web-ui-notify'

# ── @dsh-external/dsh-suggested-replies ──
# ── @dsh-external/dsh-suggested-replies: REMOVED (v2 incompatibility) ──
# 2026-08-14 v2 standalone 实测：插件 inject 服务 `workspaceRegistry`
# （0808 snapshot API），v2 harness 无此服务（workspace 包提供
# `workspace`/`workspaceContext` 等新键），boot fail-loud 挂起。v2 组合中移除。

# ── whale-girl: REMOVED (v2 incompatibility) ──
# 2026-08-14 v2 standalone 实测：插件 inject 服务 `jobs` + `webServer`，
# v2 harness 无 `jobs` 服务（0808 的 dsh-jobs 不在 v2 源码树），boot
# fail-loud 挂起。v2 组合中移除；webServer 部分由 harness 源码别名提供
# （fork 修复：packages/host/webserver 构造时 ctx.provide("webServer", ...)）。

# ── @dsh-community/multimedia-webui-input（判定不兼容 → 禁用）──
# 依赖 @deepseek-ai/dsh-client-ui-slash——官方 harness 不存在此包（rc.5 无此
# 依赖），无法修复，禁用（同 v1.2 验收报告 legacy/docs-验收报告-20260814.md）。
# 保留行便于官方补包后以 overlay 恢复。
- insert:
    - id: community-multimedia-webui-input
      name: '@dsh-community/multimedia-webui-input'
      disabled: true

# ── @omdsh-dev/dsh-drag-and-drop ──
# dsh-drag-and-drop bundle patch: mount the file-drag path plugin.
# The host half (package root) registers the file-locate HTTP route; the
# browser half (dsh.client) is discovered automatically through the package's
# dsh.client declaration + exports["./client"].
# NOTE: vendored package.json name 为 @omdsh-dev/dsh-drag-and-drop（非原
# allinone 行的 @bill9109/dsh-drag-and-drop，已按实际 name 修正）。
- insert:
    - id: drag-and-drop
      name: '@omdsh-dev/dsh-drag-and-drop'

# ── @dsh-external/dsh-stickers ──
- insert:
    - id: dsh-stickers
      name: '@dsh-external/dsh-stickers'

# ── @dsh-external/dsh-code-map ──
- insert:
    - id: code-map
      name: '@dsh-external/dsh-code-map'

# ── dsh-sonar: NOT MOUNTED (rc6 compatibility) ──
# Its published host/client contract targets obsolete Cordis services and the
# removed conversation.view slot. Keep the vendored mirror for upstream sync,
# but do not load it into a public rc6 release.

# ── @dsh-external/dsh-sidechain ──
- insert:
    - id: dsh-sidechain
      name: '@dsh-external/dsh-sidechain'

# ── dsh-diff-viewer: NOT MOUNTED (rc6 compatibility) ──
# Its browser contract references UI primitives and slot options unavailable in
# rc6. The stock edit/write renderer remains active until an upstream-sync
# build validates the replacement.

# ── dsh-track: NOT MOUNTED (rc6 compatibility) ──
# The Track Bridge targets removed session-query and Context service contracts.
# Keep the forked source and its upstream record, but wait for a compatible
# upstream sync before rebuilding and exposing the engine.

# ── @huanlin/dsh-plugin-yet-another-subagent: REMOVED (v2 incompatibility) ──
# 2026-08-14 v2 standalone 实测：该插件启动时 registerGlobal 注册工具
# "subagent"，与 v2 base bundle 的官方 tool-subagent 重名，boot fail-loud
# 硬失败。v2 组合中该插件从 profile 层移除；官方 subagent 工具恢复生效。
# fork 路径（tool-subagent-fork，工具名 subagent_fork）不冲突，保持可用。

# ── @huanlin/dsh-plugin-ya-workspace-sidebar ──
# Replace the official workspace browser. The official client package claims
# both sidebar.workspaces and conversation.hero.workspace, so the replacement
# provides both seats before taking over the browsing information architecture.
- insert:
    - id: ya-workspace-sidebar
      name: '@huanlin/dsh-plugin-ya-workspace-sidebar'

# ── @huanlin/dsh-plugin-interpreters ──
# dsh-interpreters bundle layer: inserts the plugin row.
# Defaults: python/node from PATH, 30s timeout.
- insert:
    - id: dsh-interpreters
      name: '@huanlin/dsh-plugin-interpreters'
      config:
        pythonPath: 'python'
        nodePath: 'node'
        timeoutMs: 30000

