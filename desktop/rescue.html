<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>魔理沙急救模式</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font:
                    15px/1.6 -apple-system,
                    "PingFang SC",
                    "Microsoft YaHei",
                    sans-serif;
            }
            @media (prefers-color-scheme: light) {
                html,
                body {
                    background: #f5f6f8;
                    color: #1c1f26;
                }
                .card {
                    background: #fff;
                    border: 1px solid #e5e7eb;
                }
                .sub {
                    color: #6b7280;
                }
                .error-box {
                    background: #fef2f2;
                    border: 1px solid #fecaca;
                    color: #991b1b;
                }
                .btn {
                    background: #4c8bf5;
                    color: #fff;
                }
                .btn.secondary {
                    background: #e5e7eb;
                    color: #1c1f26;
                }
                .btn.danger {
                    background: #ef4444;
                }
            }
            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background: #0f1115;
                    color: #e6e6e6;
                }
                .card {
                    background: #171a21;
                    border: 1px solid #262b36;
                }
                .sub {
                    color: #9aa4b2;
                }
                .error-box {
                    background: #2a1215;
                    border: 1px solid #5c1f26;
                    color: #f2b8b5;
                }
                .btn {
                    background: #4c8bf5;
                    color: #fff;
                }
                .btn.secondary {
                    background: #262b36;
                    color: #e6e6e6;
                }
                .btn.danger {
                    background: #b91c1c;
                }
            }
            body {
                padding: 24px;
            }
            .card {
                max-width: 560px;
                width: 100%;
                padding: 28px 32px;
                border-radius: 12px;
                box-sizing: border-box;
            }
            h1 {
                font-size: 22px;
                margin: 0 0 8px;
            }
            .lead {
                margin: 0 0 20px;
            }
            .error-box {
                padding: 12px 14px;
                border-radius: 8px;
                font-size: 13px;
                margin-bottom: 16px;
                white-space: pre-wrap;
                word-break: break-all;
                max-height: 160px;
                overflow: auto;
            }
            .option {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 10px 0;
                border-bottom: 1px solid rgba(127, 127, 127, 0.15);
            }
            .option:last-of-type {
                border-bottom: none;
            }
            .option input {
                margin-top: 4px;
                accent-color: #4c8bf5;
                width: 16px;
                height: 16px;
            }
            .option .opt-title {
                font-weight: 600;
            }
            .option.disabled {
                opacity: 0.45;
            }
            .actions {
                display: flex;
                gap: 10px;
                margin-top: 20px;
                flex-wrap: wrap;
            }
            .btn {
                border: none;
                border-radius: 8px;
                padding: 10px 18px;
                font-size: 14px;
                cursor: pointer;
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .btn.link {
                background: none;
                color: #4c8bf5;
                padding: 10px 8px;
            }
            #status {
                margin-top: 14px;
                font-size: 13px;
                min-height: 20px;
            }
            .warn {
                margin-top: 14px;
                font-size: 12px;
            }
            .spinner {
                display: inline-block;
                width: 12px;
                height: 12px;
                border: 2px solid rgba(127, 127, 127, 0.3);
                border-top-color: #4c8bf5;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                vertical-align: -2px;
                margin-right: 6px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>魔理沙急救模式</h1>
            <p class="lead sub">哎呀，魔理沙无法正常启动，即使打开极简模式仍无法正常运行。</p>

            <div id="errorBox" class="error-box" hidden></div>

            <div class="option">
                <input type="checkbox" id="optBackup" checked />
                <label for="optBackup">
                    <span class="opt-title">备份当前代码与配置</span><br />
                    <span class="sub">恢复前把整个运行现场（源码、配置、会话）搬到备份目录，可手动还原</span>
                </label>
            </div>
            <div class="option">
                <input type="checkbox" id="optConfig" checked />
                <label for="optConfig">
                    <span class="opt-title">初始化配置：重置所有用户配置</span><br />
                    <span class="sub">清空设置、凭据、会话记录与 profile 用户层，回到出厂默认</span>
                </label>
            </div>
            <div class="option" id="optSourceWrap">
                <input type="checkbox" id="optSource" checked />
                <label for="optSource">
                    <span class="opt-title">初始化源码：从内置资源重新提取</span><br />
                    <span class="sub">从 exe 内嵌的原始 backend 重新解包，覆盖当前代码</span>
                </label>
            </div>

            <div class="actions">
                <button id="btnRescue" class="btn danger">开始恢复</button>
                <button id="btnRetry" class="btn secondary">重试完整启动</button>
                <button id="btnOpenLog" class="btn link" hidden>打开日志</button>
                <button id="btnOpenBackups" class="btn link" hidden>打开备份目录</button>
            </div>

            <div id="status" class="sub" role="status"></div>
            <div class="warn sub">
                恢复会重置全部用户配置与会话记录（默认先备份）。恢复完成后可从备份目录手动还原你自己的配置文件。
            </div>
        </div>
        <script>
            const token = new URLSearchParams(location.search).get("token") ?? "";
            const q = (k, v) => {
                const u = new URLSearchParams({ token });
                if (v !== undefined) u.set(k, v);
                return u.toString();
            };
            const $ = (id) => document.getElementById(id);

            const status = (text, busy) => {
                $("status").innerHTML = busy
                    ? `<span class="spinner"></span>${text}`
                    : text;
            };
            const setBusy = (busy) => {
                $("btnRescue").disabled = busy;
                $("btnRetry").disabled = busy;
            };

            async function api(path, body) {
                const res = await fetch(`${path}?${q()}`, {
                    method: body ? "POST" : "GET",
                    headers: body ? { "Content-Type": "application/json" } : undefined,
                    body: body ? JSON.stringify(body) : undefined,
                });
                return res.json();
            }

            async function init() {
                const st = await api("/api/state");
                if (st.lastError) {
                    const box = $("errorBox");
                    box.hidden = false;
                    box.textContent = `最近启动失败：${st.lastError}`;
                }
                if (st.capabilities && !st.capabilities.resetSource) {
                    $("optSourceWrap").classList.add("disabled");
                    $("optSource").disabled = true;
                    $("optSource").checked = false;
                }
                if (st.logPath) $("btnOpenLog").hidden = false;
                if (st.backupsRoot) {
                    const backups = await fetch(`/api/backups?${q()}`).then((r) => r.json());
                    if (backups.exists) $("btnOpenBackups").hidden = false;
                }
            }

            $("btnRescue").addEventListener("click", async () => {
                setBusy(true);
                status("正在恢复…这一步可能需要一两分钟（重新解包），请勿关闭窗口");
                try {
                    const r = await api("/api/rescue", {
                        backup: $("optBackup").checked,
                        resetConfig: $("optConfig").checked,
                        resetSource: $("optSource").checked,
                    });
                    if (!r.ok) {
                        status(`恢复失败：${r.error ?? "未知错误"}`);
                        setBusy(false);
                        return;
                    }
                    if (r.backupDir) {
                        const b = await fetch(`/api/backups?${q()}`).then((x) => x.json());
                        if (b.exists) $("btnOpenBackups").hidden = false;
                    }
                    status("恢复完成，正在重新启动完整模式…");
                } catch (e) {
                    status(`恢复请求失败：${e.message}`);
                    setBusy(false);
                }
            });

            $("btnRetry").addEventListener("click", async () => {
                setBusy(true);
                status("正在重新启动完整模式…");
                try {
                    await api("/api/retry");
                } catch (e) {
                    status(`请求失败：${e.message}`);
                    setBusy(false);
                }
            });

            $("btnOpenLog").addEventListener("click", () => api("/api/open-log"));
            $("btnOpenBackups").addEventListener("click", () => api("/api/open-backups"));

            init();
        </script>
    </body>
</html>
